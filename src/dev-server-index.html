<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vite Dev Server - OstroJS</title>
    <style>
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);

            margin-bottom: 0.5rem;
        }
        p {
            color: #94a3b8;
            line-height: 1.5;
        }
        a {
            color: #38bdf8;

            font-weight: 600;
        }
        a:hover {
            text-decoration: underline;
        }

</head>
<body>
    <div class="container">
        <h1>⚡ OstroJS Vite Development Server</h1>
        <p>This server serves your development assets with lightning-fast Hot Module Replacement (HMR).</p>

    </div>
